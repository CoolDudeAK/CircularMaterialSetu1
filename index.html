function vpat(fp) {
  const R = L.rng(L.hashNum(fp)), n = 21, cell = 4;
  let s = '<svg class="vpattern" viewBox="0 0 ' + (n * cell) + ' ' + (n * cell) + '" role="img" aria-label="Verification pattern derived from the passport fingerprint (decorative demo, not a scannable QR code)">';
  const fin = (x, y) => '<rect x="' + x * cell + '" y="' + y * cell + '" width="' + 7 * cell + '" height="' + 7 * cell + '" fill="#0E2841"/><rect x="' + (x + 1) * cell + '" y="' + (y + 1) * cell + '" width="' + 5 * cell + '" height="' + 5 * cell + '" fill="#fff"/><rect x="' + (x + 2) * cell + '" y="' + (y + 2) * cell + '" width="' + 3 * cell + '" height="' + 3 * cell + '" fill="#0E2841"/>';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
    if (!inF && R() > 0.52) s += '<rect x="' + x * cell + '" y="' + y * cell + '" width="' + cell + '" height="' + cell + '" fill="#0E2841"/>';
  }
  return s + fin(0, 0) + fin(14, 0) + fin(0, 14) + '</svg>';
}

function carbonState() { if (!UI.carbon) UI.carbon = Object.assign({}, L.CARBON_DEFAULTS); return UI.carbon; }
const kg = x => N(x, 1) + ' kgCO₂e';
function carbonResult() {
  const c = carbonState(), r = L.carbon(c);

  const bar = (label, val, cls, sign) => '<div style="margin:.45rem 0"><div class="row between small"><span>' + label + '</span><b class="num">' + sign + N(Math.abs(val) / 1000, 3) + ' tCO₂e</b></div><div class="meter" role="img" aria-label="' + label + ' ' + N(val / 1000, 3) + ' tonnes CO2e"><i style="width:' + Math.min(100, Math.abs(val) / mx * 100) + '%;background:' + cls + '"></i></div></div>';

    '<h4 style="margin-top:1rem">Formula, with your numbers</h4>' +

    bar('Virgin aggregate emissions displaced', r.gross, '#156082', '+') + bar('Processing emissions', r.proc, '#E97132', '−') + bar('Transport emissions', r.trans, '#B4501A', '−') + bar('Net carbon avoided', r.net, r.net >= 0 ? '#196B24' : '#B3261E', r.net >= 0 ? '+' : '−') +

/* ---------- render ---------- */
function render() {
  const app = $('#app'); if (!app) return;
  const ae = document.activeElement; let sel = null;
  if (ae && ae !== document.body && !UI.focusMain) {
    if (ae.id) sel = '#' + ae.id;
    else if (ae.dataset && ae.dataset.act) sel = '[data-act="' + ae.dataset.act + '"]' + ['step', 'k', 'bid', 'p', 'decision', 'route', 'm'].filter(k => ae.dataset[k] !== undefined).map(k => '[data-' + k + '="' + ae.dataset[k] + '"]').join('');
  }
  let inner;
  try {
    switch (UI.route) {
      case 'register': inner = viewRegister(); break;
      case 'log': inner = viewLog(); break;
      case 'work': inner = viewWork(); break;
      case 'carbon': inner = viewCarbon(); break;
      case 'ulb': inner = viewUlb(); break;
      case 'about': inner = viewAbout(); break;
      default: inner = viewHome();
    }
  } catch (err) {
    console.error(err);
    inner = '<div class="card">' + banner('fail', 'x', 'This view hit an unexpected problem', esc(err.message) + '<br><button class="btn small" data-act="go" data-route="home">Back to Overview</button> <button class="btn small" data-act="resetDemo">Reset demo data</button>') + '</div>';
  }
  app.innerHTML = shell(inner);
  if (UI.focusMain) { const m = $('#main'); if (m) m.focus({ preventScroll: true }); window.scrollTo(0, 0); UI.focusMain = false; }
  else if (UI.focusInvalid) { const f = document.querySelector('[aria-invalid="true"]'); if (f) f.focus(); UI.focusInvalid = false; }
  else if (sel) { try { const el = document.querySelector(sel); if (el && !el.disabled) el.focus({ preventScroll: true }); } catch (e) { /* selector no longer valid */ } }
  document.title = 'Circular Material Setu — working prototype';
}

  labSample(d) { const b = curBatch(); const s = X.LAB_SAMPLES[d.k].v; Object.keys(s).forEach(k => { UI.draft['ev:' + b.id + ':' + k] = String(s[k]); }); UI.err['ev:' + b.id] = null; render(); },
  saveEvidence() {

  reopen() { const b = curBatch(); if (!b || b.locked) return; X.reopen(S, b, who(), X.nowIso()); clearDrafts('so:' + b.id + ':'); save(); toast('Batch re-opened for re-validation.', 'info'); UI.step = 'check'; render(); },
  signoff(d) {

function draftFrom(el) {

function onField(e) {
