/* Design tokens extracted from the Circular Material Setu pitch deck:
   navy #0E2841 · orange #E97132 · green #196B24 · teal #156082 · sky #0F9ED5 · surface #F6F6F6
   greens/ambers tints #EAF6EC / #FDF3E2 / #FCEEE3 · magenta #A02B93 (theme accent 5) · Poppins + Calibri */
:root{
  --navy:#0E2841; --navy-2:#173858; --teal:#156082; --orange:#E97132; --orange-ink:#B4501A; --green:#196B24; --sky:#0F9ED5; --magenta:#A02B93;
  --surface:#F6F6F6; --card:#FFFFFF; --line:#CECECE; --line-2:#E4E4E4; --grey:#5F5F5F; --ink:#0E2841;
  --pass-bg:#EAF6EC; --pass-ink:#14561D; --pass-line:#196B24;
  --warn-bg:#FDF3E2; --warn-ink:#7A4B00; --warn-line:#C98A1B;
  --fail-bg:#FDECEA; --fail-ink:#9B1C14; --fail-line:#B3261E;
  --info-bg:#E8F3F8; --info-ink:#0F4F6B; --info-line:#156082;
  --ai-bg:#F8EAF6; --ai-ink:#7A1F70; --ai-line:#A02B93;
  --radius:10px; --shadow:0 1px 2px rgba(14,40,65,.08),0 4px 14px rgba(14,40,65,.06);
  --font:'Poppins','Segoe UI',Calibri,system-ui,-apple-system,sans-serif; --body:'Calibri','Segoe UI','Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:130px}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--font);color:var(--navy);margin:0 0 .4em;line-height:1.25}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.35rem;font-weight:700} h3{font-size:1.05rem;font-weight:600} h4{font-size:.95rem;font-weight:600}
p{margin:0 0 .7em} a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--orange);color:var(--navy);padding:.6rem 1rem;z-index:100;font-weight:700}
.skip:focus{left:8px;top:8px}
.eyebrow{font-family:var(--font);font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--orange-ink);margin-bottom:.3rem}
.muted{color:var(--grey)} .small{font-size:.86rem} .tiny{font-size:.78rem} .mono{font-family:ui-monospace,Consolas,monospace;font-size:.85em}
.num{font-variant-numeric:tabular-nums}

/* ---- shell ---- */
.topbar{background:var(--navy);color:#fff;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:.6rem;margin-right:auto;text-decoration:none;color:#fff}
.brand b{font-family:var(--font);font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-size:.68rem;color:#C9D6E3;letter-spacing:.03em}
.topctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.topbar label{font-size:.72rem;color:#C9D6E3;display:block}
.topbar select{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem;min-height:36px}
.switch{display:inline-flex;align-items:center;gap:.5rem;background:#1B3C5E;color:#fff;border:1px solid #3A5A7C;border-radius:999px;padding:.3rem .8rem;cursor:pointer;min-height:36px}
.switch .dot{width:10px;height:10px;border-radius:50%;background:#7CD08A;border:2px solid #fff}
.switch[aria-checked="false"] .dot{background:#F2B45A;border-radius:2px}
.pill-proto{background:var(--orange);color:var(--navy);font-weight:700;font-size:.68rem;padding:.25rem .6rem;border-radius:999px;font-family:var(--font);letter-spacing:.04em}
.creed{background:#0A1E33;color:#E6EEF6;font-size:.82rem;padding:.4rem 1rem;display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;justify-content:center}
.creed span b{color:#FFB98A}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:1.2rem;max-width:1360px;margin:0 auto;padding:1rem}
.sidenav{position:sticky;top:96px;align-self:start}
.sidenav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem}
.sidenav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:.55rem .7rem;cursor:pointer;font-family:var(--font);font-size:.86rem;font-weight:500;color:var(--navy);display:flex;gap:.55rem;align-items:center;min-height:42px}
.sidenav button:hover{background:#fff;border-color:var(--line)}
.sidenav button[aria-current="page"]{background:var(--navy);color:#fff}
.sidenav svg{flex:none}
main{min-width:0}
main:focus{outline:none}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem 1rem;align-items:flex-end;margin-bottom:1rem}
.view-head p{margin:0;max-width:70ch}
footer{max-width:1360px;margin:1rem auto 2rem;padding:0 1rem;color:var(--grey);font-size:.82rem}
footer .row{border-top:1px solid var(--line);padding-top:.8rem;display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;justify-content:space-between;align-items:center}

/* ---- cards & grid ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3:first-child,.card h2:first-child{margin-top:0}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.g-eq{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.g-res{grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr)}
.stack>*+*{margin-top:1rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.between{justify-content:space-between}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:.8rem 1rem}
.kpi .v{font-family:var(--font);font-size:1.6rem;font-weight:700;color:var(--navy);line-height:1.15}
.kpi .l{font-size:.82rem;color:var(--grey)}
.kpi .s{font-size:.72rem;color:var(--grey);margin-top:.2rem}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:8px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-family:var(--font);font-weight:600;font-size:.85rem;padding:.5rem .95rem;min-height:40px;cursor:pointer;text-decoration:none}
.btn:hover{background:#EEF3F8}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-2)}
.btn.accent{background:var(--orange);border-color:var(--orange);color:var(--navy)}.btn.accent:hover{background:#F08346}
.btn.danger{border-color:var(--fail-line);color:var(--fail-ink);background:#fff}.btn.danger:hover{background:var(--fail-bg)}
.btn.small{padding:.3rem .65rem;min-height:32px;font-size:.78rem}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}

.b-human{background:#fff;color:var(--navy);border:2px double var(--navy)}
.b-sim{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.b-real{background:var(--pass-bg);color:var(--pass-ink);border:1px solid var(--pass-line)}
.b-src{background:#EEF3F8;color:#284B6B;border:1px solid #C7D5E3;font-weight:500;font-family:var(--body);font-size:.72rem;letter-spacing:0}
.tone-pass{background:var(--pass-bg);color:var(--pass-ink);border:1px solid var(--pass-line)}
.tone-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.tone-fail{background:var(--fail-bg);color:var(--fail-ink);border:1px solid var(--fail-line)}
.tone-info{background:var(--info-bg);color:var(--info-ink);border:1px solid var(--info-line)}
.tone-neutral{background:#F0F0F0;color:#3A3A3A;border:1px solid #BDBDBD}
.banner{display:flex;gap:.7rem;align-items:flex-start;border-radius:var(--radius);padding:.75rem .95rem}
.banner svg{flex:none;width:22px;height:22px;margin-top:.1rem}
.banner .bt{font-family:var(--font);font-weight:700;font-size:.95rem;line-height:1.3}
.banner p{margin:.15rem 0 0;font-size:.92rem}
.banner.big .bt{font-size:1.1rem}
.src{font-size:.72rem;color:#284B6B;background:#EEF3F8;border:1px solid #C7D5E3;border-radius:5px;padding:0 .35rem;margin-left:.25rem;white-space:nowrap;font-family:var(--body)}

/* ---- forms ---- */
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.8rem}
.field>label,.field>.lab{font-weight:600;font-size:.86rem;color:var(--navy)}
.field .hint{font-size:.78rem;color:var(--grey)}
.field .err{font-size:.8rem;color:var(--fail-ink);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{border:1.5px solid #8A97A6;border-radius:8px;padding:.5rem .65rem;background:#fff;min-height:42px;width:100%}
input[type=range]{width:100%;accent-color:var(--teal);min-height:28px}
input:disabled,select:disabled,textarea:disabled{background:#EFEFEF;color:#666;cursor:not-allowed}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--fail-line);background:#FFF8F7}
.choice{display:flex;flex-wrap:wrap;gap:.5rem}
.choice label{display:inline-flex;gap:.4rem;align-items:center;border:1.5px solid #8A97A6;border-radius:8px;padding:.4rem .7rem;cursor:pointer;background:#fff;font-size:.9rem;min-height:40px}
.choice input{accent-color:var(--navy)}
.choice label:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
.choice label:has(input:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.check{display:flex;gap:.55rem;align-items:flex-start;font-size:.9rem;margin:.35rem 0}
.check input{margin-top:.3rem;width:18px;height:18px;accent-color:var(--navy)}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:.7rem .9rem;margin:0 0 .9rem}
legend{font-family:var(--font);font-weight:600;font-size:.85rem;padding:0 .4rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 .9rem}

/* ---- tables ---- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:.5rem .65rem;border-bottom:1px solid var(--line-2);vertical-align:top}
th{background:#EEF3F8;color:var(--navy);font-family:var(--font);font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.hl td{background:#FFF7EE}
td.r,th.r{text-align:right}

/* ---- pipeline ---- */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem;list-style:none;margin:0;padding:0}
.pipe li{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:.6rem .7rem;position:relative;min-height:88px}
.pipe li .n{font-family:var(--font);font-size:1.4rem;font-weight:700;color:var(--navy);line-height:1}
.pipe li .t{font-family:var(--font);font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--orange-ink);text-transform:uppercase}
.pipe li .d{font-size:.78rem;color:var(--grey);margin-top:.2rem}
.pipe li:not(:last-child)::after{content:"→";position:absolute;right:-.62rem;top:50%;transform:translateY(-50%);z-index:2;color:var(--navy);font-weight:700;font-size:.9rem;background:var(--surface);border-radius:50%;width:1.1rem;height:1.1rem;display:grid;place-items:center;line-height:1}
.pipe li:nth-child(1){border-top:4px solid #1F5F8B}.pipe li:nth-child(2){border-top:4px solid #156082}.pipe li:nth-child(3){border-top:4px solid #196B24}.pipe li:nth-child(4){border-top:4px solid #0E2841}.pipe li:nth-child(5){border-top:4px solid #E97132}

/* three authorities */
.auth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.auth .card{border-width:2px}
.auth .a-ai{border-style:dashed;border-color:var(--ai-line)} .auth .a-rule{border-color:var(--navy)} .auth .a-human{border-style:double;border-width:4px;border-color:var(--navy)}

/* ---- stepper ---- */
.stepper{list-style:none;margin:0 0 1rem;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem}
.stepper button{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:.5rem .65rem;cursor:pointer;min-height:64px;display:flex;flex-direction:column;gap:.1rem}
.stepper button:hover{border-color:var(--navy)}
.stepper button[aria-current="step"]{border-color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy);background:#F3F7FB}
.stepper .sn{font-family:var(--font);font-size:.68rem;font-weight:600;letter-spacing:.06em;color:var(--orange-ink);text-transform:uppercase}
.stepper .st{font-family:var(--font);font-weight:600;font-size:.84rem;color:var(--navy)}
.stepper .ss{font-size:.72rem;display:flex;gap:.3rem;align-items:center}
.stepper .ss svg{width:13px;height:13px}
.stepper button.locked{background:#F1F1F1;color:#666}
.stepper .done .ss{color:var(--pass-ink)} .stepper .locked .ss{color:#555}

/* ---- CV pile ---- */
.pilebox{background:#2A2F36;border-radius:var(--radius);padding:.5rem;position:relative}
.pilebox>svg{display:block;width:100%;height:auto;background:#3A4048;border-radius:6px}
.pilebox .cap{color:#D6DEE7;font-size:.72rem;display:flex;justify-content:space-between;padding:.3rem .2rem 0;flex-wrap:wrap;gap:.4rem}
.det{opacity:0;animation:pop .3s forwards}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.scanline{animation:sweep 1.6s linear forwards}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(640px)}}
.legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.8rem;margin-top:.5rem}
.legend span{display:inline-flex;gap:.35rem;align-items:center}
.sw{width:26px;height:16px;display:inline-block;background:#fff;border-radius:3px}
.bar{height:12px;background:#E4E9EE;border-radius:6px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--navy)}
.bar.c-concrete>i{background:#5B6B7B}.bar.c-brick>i{background:#B4501A}.bar.c-contam>i{background:#A02B93}.bar.c-steel>i{background:#156082}
.meter{height:16px;background:#E4E9EE;border-radius:8px;overflow:hidden;position:relative}
.meter>i{display:block;height:100%}
.stackbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid #9AA7B5;background:#fff}
.stackbar>i{display:block;height:100%}
.hatch1{background:#5B6B7B}.hatch2{background:repeating-linear-gradient(45deg,#B4501A 0 5px,#D77A45 5px 9px)}.hatch3{background:repeating-linear-gradient(90deg,#A02B93 0 4px,#D79BCF 4px 8px)}.hatch4{background:repeating-linear-gradient(0deg,#156082 0 4px,#7FB6CF 4px 8px)}

/* ---- passport ---- */
.passport{position:relative;background:#fff;border:2px solid var(--navy);border-radius:14px;padding:1.2rem;box-shadow:var(--shadow)}
.passport .ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;border-bottom:2px solid var(--navy);padding-bottom:.8rem;margin-bottom:.9rem}
.passport .pid{font-family:var(--font);font-size:1.4rem;font-weight:700}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:.25rem .8rem;font-size:.9rem;margin:0}
.kv dt{color:var(--grey)} .kv dd{margin:0;font-weight:600}
.psec{border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem}
.psec h4{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink);margin-bottom:.5rem}
.sigblock{border:2px solid var(--pass-line);background:var(--pass-bg);border-radius:10px;padding:.8rem 1rem}
.sig{font-family:'Segoe Script','Brush Script MT','Lucida Handwriting',cursive;font-size:1.6rem;color:#0B2B6B;border-bottom:1.5px solid #0B2B6B;display:inline-block;padding:0 .5rem .1rem 0;margin:.2rem 0}
.locked-wrap{position:relative;min-height:720px}
.locked-wrap .ghost{filter:blur(2px) grayscale(1);opacity:.45;pointer-events:none;user-select:none}
.locked-wrap .lockmsg{position:absolute;inset:0;display:grid;place-items:start center;padding:1.5rem 1rem}
.lockcard{background:#fff;border:2px solid var(--fail-line);border-radius:12px;padding:1rem 1.2rem;max-width:520px;box-shadow:var(--shadow);text-align:left}
.skel{height:14px;background:#D9DEE3;border-radius:4px;margin:.5rem 0}
.timeline{list-style:none;margin:0;padding:0 0 0 1rem;border-left:3px solid var(--navy)}
.timeline li{position:relative;padding:0 0 .7rem .8rem;font-size:.86rem}
.timeline li::before{content:"";position:absolute;left:-1.5rem;top:.3rem;width:12px;height:12px;background:var(--navy);border-radius:50%;border:2px solid #fff}
.unlock{animation:unlock .8s ease}
@keyframes unlock{0%{box-shadow:0 0 0 0 rgba(25,107,36,.55)}100%{box-shadow:0 0 0 22px rgba(25,107,36,0)}}
.vpattern{width:96px;height:96px;border:1px solid var(--navy);padding:4px;background:#fff}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:.6rem 1rem;border-radius:10px;font-size:.9rem;box-shadow:var(--shadow);max-width:90vw;pointer-events:auto;border-left:6px solid var(--orange)}
.toast.t-fail{border-left-color:#FF8A80}.toast.t-pass{border-left-color:#7CD08A}

details.card>summary,details.acc>summary{cursor:pointer;font-family:var(--font);font-weight:600;color:var(--navy);min-height:32px}
details.acc{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:.6rem .9rem;margin-bottom:.6rem}
ul.tick{list-style:none;margin:.3rem 0;padding:0} ul.tick li{display:flex;gap:.5rem;align-items:flex-start;margin:.25rem 0;font-size:.9rem}
ul.tick svg{width:17px;height:17px;flex:none;margin-top:.15rem}
.gate-ok{color:var(--pass-ink)} .gate-no{color:var(--fail-ink)}
.ico{display:inline-block;vertical-align:-3px}
.steel-note{border-left:5px solid var(--navy);padding:.4rem .8rem;background:#F3F7FB;border-radius:0 8px 8px 0;font-size:.9rem}

@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr);padding:.7rem}
  .sidenav{position:static;min-width:0}
  .sidenav>p{display:none}
  .sidenav ul{flex-direction:row;overflow-x:auto;padding-bottom:.3rem}
  .sidenav button{white-space:nowrap;width:auto;border-color:var(--line);background:#fff}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-side,.g-eq,.g-res{grid-template-columns:1fr}
  .pipe,.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pipe li:not(:last-child)::after{display:none}
  .auth{grid-template-columns:1fr}
}
@media (max-width:640px){
  .g2,.g3,.g4,.two{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:.4rem}
  h1{font-size:1.5rem}
  .topbar{position:static}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .det{animation:none;opacity:1}.scanline{animation:none;display:none}.unlock{animation:none}
}
@media print{
  .topbar,.creed,.sidenav,footer,.no-print,.stepper,.view-head .row{display:none!important}
  .layout{display:block;padding:0} body{background:#fff}
  .passport{box-shadow:none;border-radius:0}
}
/* overflow hardening */
.grid>*,.stack>*,.two>*,.row>*{min-width:0}
.badge{max-width:100%}
.row.between>.badge{white-space:normal}
select,input,textarea{max-width:100%}
.tablewrap{max-width:100%}
@media (max-width:640px){.badge{white-space:normal}.pilebox .cap{font-size:.68rem}}
.tablewrap{position:relative}

</style>

<a class="skip" href="#main">Skip to main content</a>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:1rem;font-family:sans-serif">Circular Material Setu is a single-file interactive prototype and needs JavaScript enabled.</p></noscript>
<script>
/* =====================================================================
   CIRCULAR MATERIAL SETU — LOGIC LAYER (pure functions, no DOM)
   Three deliberately separate engines:
     1. CV classifier   -> PROBABILISTIC, simulated, advisory only
     2. IS-code checker -> DETERMINISTIC hard-coded rules, never model output
     3. Carbon engine   -> transparent arithmetic
   ===================================================================== */
(function (root) {
'use strict';
const L = {};

/* ---------- tiny utilities ---------- */
function cyrb53(str, seed) {
  seed = seed || 0;
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
// Integrity fingerprint for the demo record. NOT cryptographic, NOT a blockchain.
L.fingerprint = function (s) { return 'CMS-' + cyrb53(String(s)).toString(16).toUpperCase().padStart(14, '0'); };
L.hashNum = function (s) { return cyrb53(String(s)); };

function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
L.rng = rng;
function gauss(R) { let u = 0, v = 0; while (u === 0) u = R(); while (v === 0) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
L.clamp = clamp;
const round = (x, d) => { const p = Math.pow(10, d || 0); return Math.round(x * p) / p; };
L.round = round;

/* =====================================================================
   1. IS 383:2016 TABLE 1 — DETERMINISTIC RULE ENGINE
   Source of truth: Research Dossier §3.2 ("Exact limits from Table 1").
     RCA : 25 % plain | 20 % reinforced (ONLY up to M25) | 100 % lean (< M15)
     RA  : permitted in LEAN concrete ONLY
   RCA (Recycled Concrete Aggregate) and RA (Recycled Aggregate — broader,
   lower-quality category) are NEVER interchanged anywhere in this code.
   ===================================================================== */
L.GRADES = ['M7.5', 'M10', 'M15', 'M20', 'M25', 'M30', 'M35', 'M40'];
L.gradeNum = g => parseFloat(String(g).replace('M', ''));
L.USES = { plain: 'Plain concrete', reinforced: 'Reinforced concrete', lean: 'Lean concrete' };
L.TYPES = { RCA: 'RCA — Recycled Concrete Aggregate', RA: 'RA — Recycled Aggregate' };
L.TABLE1 = Object.freeze({
  ref: 'IS 383:2016 Table 1',
  RCA: Object.freeze({
    plain: Object.freeze({ max: 25 }),
    reinforced: Object.freeze({ max: 20, maxGrade: 25 }),
    lean: Object.freeze({ max: 100, belowGrade: 15 })
  }),
  RA: Object.freeze({ lean: Object.freeze({ max: 100 }) })   // lean concrete only
});
L.RCA_MIN_CONCRETE_SHARE = 0.90;   // platform stream-purity rule (NOT an IS-code figure)
L.CONTAM_GATE = 0.05;              // platform contamination gate (NOT an IS-code figure)
L.LOWCONF = 0.60;                  // fragment confidence below which manual review is requested

L.checkTable1 = function (inp) {
  const T = L.TABLE1, type = inp.type, use = inp.use, grade = inp.grade;
  const pct = Number(inp.pct), g = L.gradeNum(grade);
  const REF = T.ref;
  const out = { requested: pct, maxAllowed: null, rules: [], verdict: 'PASS', headline: '', fix: '' };
  const R = (id, label, limit, actual, state, ref, note) => out.rules.push({ id, label, limit, actual, state, ref: ref || REF, note: note || '' });

  if (!isFinite(pct) || pct < 0 || pct > 100 || inp.pct === '' || inp.pct === null) {
    out.verdict = 'INVALID'; out.headline = 'Enter a replacement percentage between 0 and 100 %.';
    R('input', 'Replacement percentage', '0–100 %', String(inp.pct), 'FAIL', 'Input validation');
    return out;
  }
  if (use === 'lean' && g >= 15) {
    out.verdict = 'INVALID';
    out.headline = grade + ' is not lean concrete: Table 1 defines lean concrete as below M15. Choose Plain or Reinforced concrete, or a grade below M15.';
    R('consistency', 'Use / grade consistency', 'Lean concrete = below M15', grade, 'FAIL', REF + ' (lean concrete definition)');
    return out;
  }
  if (use !== 'lean' && g < 15) {
    out.verdict = 'INVALID';
    out.headline = grade + ' is below M15, which Table 1 treats as lean concrete. Choose "Lean concrete" as the intended use.';
    R('consistency', 'Use / grade consistency', 'Below M15 = lean concrete', grade, 'FAIL', REF + ' (lean concrete definition)');
    return out;
  }
  R('consistency', 'Use / grade consistency', L.USES[use] + ' at ' + grade, grade, 'PASS', 'Input validation');

  if (type === 'RCA') {
    const row = T.RCA[use];
    if (use === 'reinforced' && g > row.maxGrade) {
      out.verdict = 'REDESIGN';
      R('grade', 'Reinforced-concrete grade ceiling for RCA', '≤ M' + row.maxGrade, grade, 'FAIL', REF + ' — RCA, reinforced concrete');
      R('limit', 'RCA replacement limit (reinforced)', '≤ ' + row.max + ' % — only up to M' + row.maxGrade, pct + ' %', 'INFO', REF, 'The 20 % limit is not extended above M25.');
      out.headline = 'Special structural redesign required. Table 1 allows RCA in reinforced concrete only up to M25; ' + grade + ' is outside that scope.';
      out.fix = 'Choose a grade of M25 or lower, or route the batch to a specific structural redesign outside this platform.';
      return out;
    }
    if (use === 'reinforced') R('grade', 'Reinforced-concrete grade ceiling for RCA', '≤ M' + row.maxGrade, grade, 'PASS', REF + ' — RCA, reinforced concrete');
    out.maxAllowed = row.max;
    const ok = pct <= row.max;
    R('limit', 'RCA replacement limit — ' + L.USES[use].toLowerCase(), '≤ ' + row.max + ' %', pct + ' %', ok ? 'PASS' : 'FAIL', REF + ' — RCA, ' + L.USES[use].toLowerCase());
    out.verdict = ok ? 'PASS' : 'FAIL';
    out.headline = ok
      ? 'RCA at ' + pct + ' % is within the Table 1 limit of ' + row.max + ' % for ' + L.USES[use].toLowerCase() + ' (' + grade + ').'
      : 'RCA at ' + pct + ' % exceeds the Table 1 limit of ' + row.max + ' % for ' + L.USES[use].toLowerCase() + ' (' + grade + ').';
    if (!ok) out.fix = 'Reduce the replacement to ' + row.max + ' % or lower.';
    return out;
  }

  // type === 'RA'  -> lean concrete ONLY
  if (use !== 'lean') {
    out.maxAllowed = 0; out.verdict = 'FAIL';
    R('limit', 'RA permitted in lean concrete only', 'Lean concrete (below M15) only', L.USES[use], 'FAIL', REF + ' — RA');
    out.headline = 'RA (general Recycled Aggregate) is not permitted in ' + L.USES[use].toLowerCase() + '. Table 1 allows RA in lean concrete only.';
    out.fix = 'Use RA only for lean concrete (below M15), or re-sort the material to qualify as RCA.';
    return out;
  }
  const ra = T.RA.lean;
  out.maxAllowed = ra.max;
  const ok = pct <= ra.max;
  R('limit', 'RA use — lean concrete', 'Lean concrete only; ≤ ' + ra.max + ' %', pct + ' %', ok ? 'PASS' : 'FAIL', REF + ' — RA', 'Dossier states "lean concrete only" without a separate %; the lean-row ceiling of 100 % is applied — confirm against the printed table.');
  out.verdict = ok ? 'PASS' : 'FAIL';
  out.headline = 'RA in lean concrete (' + grade + ') at ' + pct + ' % — permitted category.';
  return out;
};

/* Laboratory screening — the dossier says SG and WA must "pass lab tests" but gives no
   numbers, so these are INDICATIVE screening thresholds (clearly labelled in the UI).
   AIV / LA 45 %,50 % (30 % wearing surfaces) follow the general IS 383 mechanical limits. */
L.SCREEN = [

L.LAB_RANGES = { sg: [1.5, 3.2], wa: [0, 30], aiv: [0, 100], la: [0, 100] };
L.labErrors = function (lab) {

    const v = lab ? lab[k] : null;

    else if (Number(v) < L.LAB_RANGES[k][0] || Number(v) > L.LAB_RANGES[k][1]) e[k] = 'Must be between ' + L.LAB_RANGES[k][0] + ' and ' + L.LAB_RANGES[k][1];

/* Full deterministic compliance run for one batch.

L.runCompliance = function (b) {
  const it = b.intent || {};
  const cv = b.cv || null;
  let applied = it.type, downgraded = false, typeNote = '';
  if (it.type === 'RCA' && cv && cv.concreteShare < L.RCA_MIN_CONCRETE_SHARE) {

  else if (table.verdict === 'FAIL') overall = 'FAIL';
  else if (labMissing) overall = 'INCOMPLETE';
  else if (labFail.length) overall = 'FAIL';
  else if (labFlag.length) overall = 'PASS_FLAGS';

};
L.OVERALL = {
  PASS: { label: 'COMPLIANT', tone: 'pass', icon: 'check' },
  PASS_FLAGS: { label: 'COMPLIANT — FLAGS FOR ENGINEER REVIEW', tone: 'warn', icon: 'warn' },
  FAIL: { label: 'NOT COMPLIANT — REJECTED BY RULE ENGINE', tone: 'fail', icon: 'x' },

L.checkFp = function (b) {

/* =====================================================================
   2. SIMULATED COMPUTER-VISION CLASSIFIER (probabilistic, advisory)
   Not a trained model: a weighted Gaussian-likelihood classifier over
   simulated per-fragment image features (colour, texture, edge, metallic
   index, elongation). Different inputs -> different outputs.
   ===================================================================== */
L.CLASSES = [
  { id: 'concrete', n: 1, name: 'Pure Concrete Rubble', short: 'Concrete', tag: 'C1', route: 'High RCA potential (IS 383 stream)' },
  { id: 'brick', n: 2, name: 'Red Brick / Masonry Waste', short: 'Brick', tag: 'C2', route: 'Sub-base, non-structural blocks, or lean concrete' },
  { id: 'contam', n: 3, name: 'Contaminants (wood, plastics, gypsum, soil)', short: 'Contaminants', tag: 'C3', route: 'Flagged for removal' },
  { id: 'steel', n: 4, name: 'Reinforcing Steel Scrap', short: 'Steel', tag: 'C4', route: 'Routed for recycling / salvage' }
];
const FEATS = ['hue', 'sat', 'val', 'tex', 'edge', 'metal', 'asp'];
const FW = { hue: 0.8, sat: 1.1, val: 0.6, tex: 0.9, edge: 0.6, metal: 1.5, asp: 0.9 };
const PROTO = {
  concrete: { concrete: { hue: [38, 22], sat: [0.08, 0.05], val: [0.58, 0.12], tex: [0.65, 0.12], edge: [0.55, 0.15], metal: [0.05, 0.05], asp: [1.3, 0.3] } },
  brick: { brick: { hue: [10, 8], sat: [0.58, 0.12], val: [0.5, 0.1], tex: [0.55, 0.12], edge: [0.65, 0.12], metal: [0.04, 0.04], asp: [1.5, 0.3] } },
  contam: {
    wood: { hue: [30, 8], sat: [0.42, 0.1], val: [0.45, 0.1], tex: [0.4, 0.1], edge: [0.7, 0.12], metal: [0.04, 0.04], asp: [3.0, 0.8] },
    plastic: { hue: [200, 90], sat: [0.7, 0.15], val: [0.75, 0.12], tex: [0.1, 0.06], edge: [0.4, 0.15], metal: [0.12, 0.08], asp: [1.8, 0.6] },
    gypsum: { hue: [50, 10], sat: [0.05, 0.03], val: [0.9, 0.06], tex: [0.2, 0.08], edge: [0.6, 0.12], metal: [0.03, 0.03], asp: [1.2, 0.3] },
    soil: { hue: [25, 6], sat: [0.35, 0.08], val: [0.3, 0.08], tex: [0.85, 0.08], edge: [0.15, 0.08], metal: [0.02, 0.02], asp: [1.0, 0.2] }
  },
  steel: { steel: { hue: [20, 15], sat: [0.5, 0.15], val: [0.35, 0.1], tex: [0.3, 0.1], edge: [0.85, 0.08], metal: [0.85, 0.08], asp: [5, 1.5] } }
};
const TEMP = 5;            // softmax temperature (keeps confidences realistic, uncalibrated)
const AREA_W = { concrete: [1.0, 0.5], brick: [0.8, 0.4], contam: [0.7, 0.5], steel: [0.3, 0.1] };
L.MODEL_INFO = { features: FEATS.slice(), weights: FW, temperature: TEMP, prototypes: PROTO };

function hueDiff(a, b) { let d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }
function llProto(f, p) {
  let s = 0;
  for (const k of FEATS) {
    const mu = p[k][0], sd = p[k][1];
    const d = k === 'hue' ? hueDiff(f.hue, mu) : f[k] - mu;
    const z = d / sd; s += FW[k] * (-0.5 * z * z - Math.log(sd));
  }
  return s;
}
function logsumexp(a) { const m = Math.max.apply(null, a); return m + Math.log(a.reduce((s, x) => s + Math.exp(x - m), 0)); }
L.classifyFeatures = function (f, q) {
  const Teff = TEMP * (1 + 1.5 * (1 - (q === undefined ? 1 : q)));   // poorer capture -> flatter (less confident) posterior
  const ll = {}, sub = {};
  ll.concrete = llProto(f, PROTO.concrete.concrete);
  ll.brick = llProto(f, PROTO.brick.brick);
  ll.steel = llProto(f, PROTO.steel.steel);
  const subs = Object.keys(PROTO.contam), sl = subs.map(k => llProto(f, PROTO.contam[k]));
  ll.contam = logsumexp(sl) - Math.log(subs.length);
  let bi = 0; sl.forEach((v, i) => { if (v > sl[bi]) bi = i; });
  const ids = ['concrete', 'brick', 'contam', 'steel'];
  const sc = ids.map(k => ll[k] / Teff), m = Math.max.apply(null, sc);
  const ex = sc.map(x => Math.exp(x - m)), Z = ex.reduce((a, b) => a + b, 0);
  const probs = {}; ids.forEach((k, i) => probs[k] = ex[i] / Z);
  let pred = ids[0]; ids.forEach(k => { if (probs[k] > probs[pred]) pred = k; });
  return { probs, pred, conf: probs[pred], sub: subs[bi] };
};
L.captureQuality = function (sc) { return clamp((0.4 * sc.light + 0.35 * sc.focus + 0.25 * (100 - sc.dust)) / 100, 0.05, 1); };

L.normalizeScene = function (sc) {
  const ids = ['concrete', 'brick', 'contam', 'steel'];
  let t = ids.reduce((s, k) => s + Math.max(0, Number(sc[k]) || 0), 0);
  const out = {};
  if (t <= 0) { ids.forEach(k => out[k] = k === 'concrete' ? 1 : 0); return out; }
  ids.forEach(k => out[k] = Math.max(0, Number(sc[k]) || 0) / t);
  return out;
};

const N_FRAG = 56, VW = 640, VH = 400;
L.VIEW = { w: VW, h: VH };
function hsv2hex(h, s, v) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); v = clamp(v, 0, 1);
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  const hx = n => Math.round((n + m) * 255).toString(16).padStart(2, '0');
  return '#' + hx(r) + hx(g) + hx(b);
}

L.generateScan = function (scene, seed) {
  const R = rng(seed);
  const f = L.normalizeScene(scene), ids = ['concrete', 'brick', 'contam', 'steel'];
  const q = L.captureQuality(scene), m = 1 + (1 - q) * 1.6;
  // largest-remainder allocation of fragment counts
  const raw = ids.map(k => f[k] * N_FRAG), cnt = raw.map(Math.floor);
  let rem = N_FRAG - cnt.reduce((a, b) => a + b, 0);
  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(p => { if (rem > 0) { cnt[p[1]]++; rem--; } });
  // fragments
  const frags = [];
  ids.forEach((k, ci) => {
    const ws = [];
    for (let i = 0; i < cnt[ci]; i++) ws.push(Math.max(0.08, AREA_W[k][0] + AREA_W[k][1] * gauss(R)));
    const sw = ws.reduce((a, b) => a + b, 0) || 1;
    ws.forEach(w => {
      let truthSub = null, protoObj;
      if (k === 'contam') { const subs = Object.keys(PROTO.contam); truthSub = subs[Math.floor(R() * subs.length)]; protoObj = PROTO.contam[truthSub]; }
      else protoObj = PROTO[k][k];
      const ft = {};
      FEATS.forEach(ff => {
        const mu = protoObj[ff][0], sd = protoObj[ff][1] * m;
        let v = mu + sd * gauss(R);
        if (ff === 'hue') v = ((v % 360) + 360) % 360;
        else if (ff === 'asp') v = clamp(v, 0.8, 9);
        else v = clamp(v, 0, 1);
        ft[ff] = v;
      });
      if (k === 'contam' && truthSub === 'plastic') ft.hue = R() * 360;
      frags.push({ truth: k, truthSub, feats: ft, area: (f[k] * w / sw) });
    });
  });
  // shuffle into grid cells (Fisher-Yates, seeded)
  for (let i = frags.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = frags[i]; frags[i] = frags[j]; frags[j] = t; }
  const cols = 8, rows = 7, cw = VW / cols, ch = VH / rows;
  frags.forEach((fr, i) => {
    const cx = (i % cols + 0.5) * cw + (R() - 0.5) * cw * 0.35, cy = (Math.floor(i / cols) + 0.5) * ch + (R() - 0.5) * ch * 0.35;
    const rot = R() * Math.PI, r = clamp(22 * Math.sqrt(Math.max(fr.area, 0.0005) * N_FRAG), 9, 27);
    let pts;
    if (fr.truth === 'steel') {
      const len = 46 + 32 * R(), wid = 5 + 2.5 * R(), c = Math.cos(rot), s = Math.sin(rot);
      pts = [[-len / 2, -wid / 2], [len / 2, -wid / 2], [len / 2, wid / 2], [-len / 2, wid / 2]].map(p => [cx + p[0] * c - p[1] * s, cy + p[0] * s + p[1] * c]);
      fr.r = len / 2;
    } else {
      const nv = 6 + Math.floor(R() * 3); pts = [];
      const elong = fr.truth === 'contam' && fr.truthSub === 'wood' ? 1.9 : 1;
      for (let v = 0; v < nv; v++) {
        const a = rot + v / nv * Math.PI * 2 + (R() - 0.5) * 0.4, rr = r * (0.72 + 0.4 * R());
        const px = Math.cos(a) * rr * elong, py = Math.sin(a) * rr; pts.push([cx + px, cy + py]);
      }
      fr.r = r;
    }
    pts = pts.map(p => [clamp(p[0], 2, VW - 2), clamp(p[1], 2, VH - 2)]);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    fr.pts = pts.map(p => [round(p[0], 1), round(p[1], 1)]);
    fr.bbox = [Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)].map(x => round(x, 1));
    fr.fill = hsv2hex(fr.feats.hue, fr.feats.sat, fr.feats.val);
    fr.id = i + 1;
    const c = L.classifyFeatures(fr.feats, q);
    fr.probs = c.probs; fr.pred = c.pred; fr.conf = c.conf; fr.sub = c.pred === 'contam' ? c.sub : null;
  });

  const shares = { concrete: 0, brick: 0, contam: 0, steel: 0 }, cs = { concrete: 0, brick: 0, contam: 0, steel: 0 }, cn = { concrete: 0, brick: 0, contam: 0, steel: 0 };
  const sub = { wood: 0, plastic: 0, gypsum: 0, soil: 0 };
  let low = 0, lowArea = 0, match = 0, totalA = 0, confW = 0;
  frags.forEach(fr => {
    shares[fr.pred] += fr.area; cs[fr.pred] += fr.conf; cn[fr.pred]++;
    totalA += fr.area; confW += fr.conf * fr.area;
    if (fr.conf < L.LOWCONF) { low++; lowArea += fr.area; }
    if (fr.pred === fr.truth) match++;
    if (fr.pred === 'contam' && fr.sub) sub[fr.sub] += fr.area;
  });
  ids.forEach(k => { shares[k] = totalA ? shares[k] / totalA : 0; });
  const meanConf = {}; ids.forEach(k => meanConf[k] = cn[k] ? cs[k] / cn[k] : null);
  const subTot = Object.values(sub).reduce((a, b) => a + b, 0) || 1;
  Object.keys(sub).forEach(k => sub[k] = sub[k] / subTot);
  const mineral = shares.concrete + shares.brick;
  const summary = {
    shares, meanConf, counts: cn, overallConf: totalA ? confW / totalA : 0,
    lowConfCount: low, lowConfShare: totalA ? lowArea / totalA : 0,
    contamSub: sub, concreteShare: mineral > 0 ? shares.concrete / mineral : 0,
    gate: shares.contam > L.CONTAM_GATE ? 'FLAGGED' : 'PASS',
    quality: q, n: frags.length, truthMatch: match
  };
  return { frags, summary };
};

/* Scene prior from batch metadata (documented on the About page) */
L.suggestScene = function (b) {
  let s;
  if (b.demolition === 'controlled') s = { concrete: 83, brick: 4, contam: 2, steel: 11 };
  else s = { concrete: 60, brick: 18, contam: 14, steel: 8 };
  if (Number(b.ageYears) >= 50) { const shift = Math.min(10, s.concrete - 40); s.concrete -= shift; s.brick += shift; }

L.SCENE_PRESETS = {

  mixed: { label: 'Mixed — general demolition', s: { concrete: 60, brick: 18, contam: 14, steel: 8 } },
  heavy: { label: 'Heavy contamination', s: { concrete: 46, brick: 12, contam: 34, steel: 8 } },
  brick: { label: 'Brick / masonry-rich', s: { concrete: 26, brick: 59, contam: 2, steel: 13 } }

  ['concrete', 'brick', 'steel'].forEach(k => out[k] = round(n[k] / t * 100, 2));
  out.contam = round(c / t * 100, 2);

};

/* =====================================================================
   3. EMBODIED-CARBON ENGINE — transparent arithmetic
   Carbon Avoided = (Mass of RCA Used × Embodied Carbon of Virgin Aggregate)
                    − (Processing & Transport Emissions)
   ===================================================================== */
L.CARBON_DEFAULTS = { mass: 500, efVirgin: 7.47, kwhPerT: 3.0, gridEf: 0.727, dist: 35, truckEf: 0.10 };
L.carbon = function (p) {
  const mass = Number(p.mass) || 0, ef = Number(p.efVirgin) || 0, kwh = Number(p.kwhPerT) || 0;
  const grid = Number(p.gridEf) || 0, dist = Number(p.dist) || 0, tef = Number(p.truckEf) || 0;
  const gross = mass * ef;                 // kgCO2e of virgin aggregate displaced
  const proc = mass * kwh * grid;          // crushing + screening (electricity)
  const trans = mass * dist * tef;         // haul
  const net = gross - (proc + trans);
  const pct = gross > 0 ? net / gross * 100 : 0;
  const perT = ef - kwh * grid;
  const breakEven = tef > 0 ? Math.max(0, perT / tef) : Infinity;
  let band = 'Net-negative', tone = 'fail';
  if (pct >= 60) { band = 'Strong'; tone = 'pass'; } else if (pct >= 30) { band = 'Moderate'; tone = 'pass'; } else if (pct >= 0) { band = 'Marginal'; tone = 'warn'; }
  return { gross, proc, trans, net, pct, score: clamp(Math.round(pct), 0, 100), breakEven, band, tone };
};
L.recycledMass = function (b) {
  if (!b.cv) return 0;
  const t = Number(b.tonnes) || 0, sh = b.cv.shares;
  const type = (b.check && b.check.applied) || (b.intent && b.intent.type) || 'RCA';
  return round(t * (type === 'RA' ? sh.concrete + sh.brick : sh.concrete), 1);
};

/* Licence-number FORMAT check only — real registry verification is a named gap */
L.licenceFormatOk = s => /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z0-9\/\-\.]{6,24}$/.test(String(s || '').trim());

root.CMS = L;
if (typeof module !== 'undefined' && module.exports) module.exports = L;
})(typeof window !== 'undefined' ? window : globalThis);

  marginal: { label: 'Marginal RCA sample', v: { sg: 2.38, wa: 4.6, aiv: 33, la: 41 } },
  ra: { label: 'Brick-rich RA sample', v: { sg: 2.14, wa: 8.6, aiv: 38, la: 44 } },
  poor: { label: 'Poor sample (fails screen)', v: { sg: 1.96, wa: 11.4, aiv: 47, la: 54 } }
};

const pad = (n, w) => String(n).padStart(w, '0');
X.nowIso = () => new Date().toISOString();

/* ---------- audit ---------- */
X.audit = function (S, b, who, msg, at, kind) {
  const e = { at: at || X.nowIso(), who, msg, kind: kind || 'evt', batch: b ? b.id : null };
  if (b) b.audit.push(e);
  S.audit.push(e); if (S.audit.length > 250) S.audit.shift();
  return e;
};

/* ---------- batch ---------- */
X.newBatch = function (S, d, who, at) {
  const id = 'CMS-B-' + S.seq.batch++;
  const b = {
    id, site: d.site, city: d.city, structure: d.structure, ageYears: Number(d.ageYears), demolition: d.demolition,
    tonnes: Number(d.tonnes), haulKm: Number(d.haulKm), notes: d.notes || '', loggedAt: at || X.nowIso(), loggedBy: who,
    sync: d.sync || 'synced', scene: null, scans: [], cv: null,
    intent: { type: 'RCA', use: 'reinforced', grade: 'M25', pct: 20 },
    processing: { crusher: '', screen: '', wash: '' }, lab: { sg: '', wa: '', aiv: '', la: '', ref: '', date: '' },
    check: null, signoff: null, passport: null, locked: false, audit: []
  };
  b.scene = L.suggestScene(b);
  S.batches.unshift(b);
  X.audit(S, b, who, 'Debris batch logged (' + b.demolition + ' demolition, ' + b.ageYears + '-yr structure, ' + b.tonnes + ' t)' + (b.sync === 'queued' ? ' — captured offline, queued for sync' : ''), at, 'ms');
  return b;
};
X.checkCurrent = b => !!(b.check && b.check.fp === L.checkFp(b));

X.runScan = function (S, b, scene, seed, who, at, note) {
  if (b.locked) throw new Error('Batch is locked after sign-off.');
  const sc = Object.assign({}, scene);
  const r = L.generateScan(sc, seed), n = b.scans.length + 1;
  b.scans.push({ n, at: at || X.nowIso(), by: who, seed, scene: sc, summary: r.summary, note: note || '' });
  b.cv = Object.assign({ scanNo: n }, r.summary);
  b.scene = sc;
  const s = r.summary;
  X.audit(S, b, who, 'Simulated CV scan #' + n + ': concrete ' + L.round(s.shares.concrete * 100, 1) + ' %, brick ' + L.round(s.shares.brick * 100, 1) + ' %, contaminants ' + L.round(s.shares.contam * 100, 1) + ' %, steel ' + L.round(s.shares.steel * 100, 1) + ' % — contamination gate ' + s.gate, at, 'ms');
  return r;
};
X.removalRescan = function (S, b, who, at) {
  const sc = L.afterRemoval(b.scene);
  X.audit(S, b, who, 'Manual contaminant removal logged (simulated); pile re-presented for scanning', at, 'ms');
  return X.runScan(S, b, sc, L.hashNum(b.id + ':rescan:' + (b.scans.length + 1)) % 100000, who, at, 'Post-removal re-scan');
};
X.saveEvidence = function (S, b, proc, lab, who, at) {
  if (b.locked) throw new Error('Batch is locked after sign-off.');
  b.processing = Object.assign({}, proc);
  b.lab = Object.assign({}, lab);
  X.audit(S, b, who, 'Processing log + lab evidence saved (SG ' + lab.sg + ', WA ' + lab.wa + ' %, AIV ' + lab.aiv + ' %, LA ' + lab.la + ' %)', at, 'ms');
};
X.recordCheck = function (S, b, who, at) {
  if (b.locked) throw new Error('Batch is locked after sign-off.');
  const r = L.runCompliance(b);
  b.check = {
    at: at || X.nowIso(), by: who, overall: r.overall, applied: r.applied, declared: r.declared, maxAllowed: r.maxAllowed,
    inputs: clone(b.intent), fp: L.checkFp(b), headline: r.table.headline, typeNote: r.typeNote, downgraded: r.downgraded,
    rules: clone(r.table.rules), lab: clone(r.lab), flags: r.labFlag.map(x => x.id)
  };
  X.audit(S, b, who, 'Deterministic IS 383:2016 check recorded: ' + L.OVERALL[r.overall].label + ' (' + b.intent.type + ' → evaluated as ' + r.applied + ', ' + b.intent.pct + ' % in ' + L.USES[b.intent.use].toLowerCase() + ' ' + b.intent.grade + ')', at, 'ms');
  return b.check;
};

/* ---------- gate model ---------- */
X.statusOf = function (b) {
  if (b.passport) return { key: 'issued', label: 'Passport issued', tone: 'pass', icon: 'check' };
  if (b.signoff && b.signoff.status === 'rejected') return { key: 'rejected', label: 'Rejected by engineer', tone: 'fail', icon: 'x' };
  if (!b.cv) return { key: 'logged', label: 'Logged — scan pending', tone: 'neutral', icon: 'info' };
  if (b.cv.gate === 'FLAGGED') return { key: 'flagged', label: 'Flagged — contaminants to remove', tone: 'fail', icon: 'warn' };
  if (!L.evidenceComplete(b)) return { key: 'classified', label: 'Classified — evidence needed', tone: 'info', icon: 'info' };
  if (!X.checkCurrent(b)) return { key: 'evidence', label: 'Evidence complete — IS check pending', tone: 'info', icon: 'info' };
  if (!L.approvable(b.check.overall)) return { key: 'noncompliant', label: 'Non-compliant — cannot be approved', tone: 'fail', icon: 'x' };
  return { key: 'await', label: 'Awaiting engineer sign-off', tone: 'warn', icon: 'warn' };
};
X.stages = function (b) {
  const gateOk = !!(b.cv && b.cv.gate === 'PASS');
  const evDone = gateOk && L.evidenceComplete(b);
  const cur = X.checkCurrent(b);
  const chkDone = evDone && !!b.check && cur;
  return {
    classify: { locked: false, done: !!b.cv && gateOk, warn: !!b.cv && !gateOk, note: !b.cv ? 'Not scanned' : gateOk ? 'Gate passed' : 'Flagged', reason: '' },
    evidence: { locked: !gateOk, done: evDone, note: evDone ? 'Complete' : !gateOk ? 'Locked' : 'Incomplete', reason: !b.cv ? 'Run the CV scan first.' : 'The contamination gate has flagged this batch. Remove contaminants and re-scan first.' },
    check: { locked: !evDone, done: chkDone, note: chkDone ? L.OVERALL[b.check.overall].label.split(' —')[0] : !evDone ? 'Locked' : (b.check ? 'Stale — re-record' : 'Not recorded'), reason: 'Complete the processing log and all four lab values first.' },
    signoff: { locked: !chkDone, done: !!b.signoff, note: b.signoff ? (b.signoff.status === 'approved' ? 'Approved' : 'Rejected') : !chkDone ? 'Locked' : 'Awaiting engineer', reason: b.check && !cur ? 'Inputs changed since the last recorded check — re-record the IS 383 check.' : 'Record the deterministic IS 383:2016 check first.' },
    passport: { locked: !b.passport, done: !!b.passport, note: b.passport ? 'Issued' : 'Locked', reason: '' }
  };
};

/* ---------- sign-off & passport (the hard gate) ---------- */
X.deploymentOptions = function (b) {
  const c = b.check; if (!c || !L.approvable(c.overall)) return [];
  const i = c.inputs, opts = [];
  const lim = c.applied;
  const desc = (grade, use, type, pct) => {
    const base = use === 'lean' ? grade + ' lean concrete sub-base' : grade + ' ' + L.USES[use].toLowerCase();
    return base + ' — ' + type + ' ≤ ' + pct + ' % of coarse aggregate by mass';
  };
  opts.push({ id: 'as', grade: i.grade, use: i.use, type: lim, pct: Number(i.pct), label: desc(i.grade, i.use, lim, Number(i.pct)) + ' (as checked)' });
  if (i.use !== 'lean') {
    const chk = L.checkTable1({ type: lim, use: 'lean', grade: 'M10', pct: Number(i.pct) });
    if (chk.verdict === 'PASS') opts.push({ id: 'lean', grade: 'M10', use: 'lean', type: lim, pct: Number(i.pct), label: desc('M10', 'lean', lim, Number(i.pct)) + ' (restricted downgrade)' });
  }
  return opts;
};
X.signoffErrors = function (b, f) {
  const e = {};
  if (!f.name || String(f.name).trim().length < 5 || !/\s/.test(String(f.name).trim())) e.name = 'Enter the engineer\'s full name (first and last).';
  if (!L.licenceFormatOk(f.licence)) e.licence = 'Enter a licence / registration number (6–24 characters, letters and digits, e.g. CE/MH/48213).';
  if (f.decision === 'reject') { if (!f.remarks || String(f.remarks).trim().length < 10) e.remarks = 'A rejection needs a written reason (at least 10 characters).'; }
  else {
    if (!f.deployment) e.deployment = 'Select the secondary deployment grade you are authorising.';
    if (!f.ack1 || !f.ack2 || !f.ack3) e.ack = 'All three attestations are required.';
    if (b.check && b.check.overall === 'PASS_FLAGS' && !f.ackFlags) e.ackFlags = 'Acknowledge the flagged lab items and the IS 456:2000 mix-design adjustment.';
  }
  return e;
};
X.gateChecklist = function (b, persona, online) {
  const st = X.stages(b), cur = X.checkCurrent(b);
  return [
    { ok: !!b.cv && b.cv.gate === 'PASS', text: 'Contamination gate passed (CV scan)' },
    { ok: st.evidence.done, text: 'Processing log and all four lab values recorded' },
    { ok: !!b.check && cur, text: 'Deterministic IS 383:2016 check recorded and current' },
    { ok: !!b.check && cur && L.approvable(b.check.overall), text: 'Rule engine verdict permits approval (not rejected / redesign / inconsistent)' },
    { ok: persona === 'eng', text: 'Acting as a Licensed Structural Engineer' },
    { ok: online, text: 'Online — licence verification requires connectivity (simulated)' }
  ];
};
X.doSignoff = function (S, b, f, who, at) {
  if (b.locked) throw new Error('Already signed off.');
  const st = X.stages(b);
  if (!st.signoff.done && st.signoff.locked) throw new Error('Sign-off is locked: ' + st.signoff.reason);
  const errs = X.signoffErrors(b, f);
  if (Object.keys(errs).length) throw Object.assign(new Error('Sign-off form incomplete'), { errs });
  const t = at || X.nowIso();
  if (f.decision === 'reject') {
    b.signoff = { status: 'rejected', name: f.name.trim(), licence: f.licence.trim().toUpperCase(), remarks: f.remarks.trim(), at: t, checkFp: b.check.fp };
    X.audit(S, b, who, 'ENGINEER REJECTION by ' + b.signoff.name + ' (' + b.signoff.licence + '): ' + b.signoff.remarks, t, 'ms');
    return b.signoff;
  }
  if (!L.approvable(b.check.overall)) throw new Error('Rule engine verdict does not permit approval.');
  const opt = X.deploymentOptions(b).find(o => o.id === f.deployment);
  if (!opt) throw new Error('Invalid deployment selection.');
  b.signoff = {
    status: 'approved', name: f.name.trim(), licence: f.licence.trim().toUpperCase(), deployment: opt.label.replace(/ \((as checked|restricted downgrade)\)$/, ''),
    deploymentSpec: { grade: opt.grade, use: opt.use, type: opt.type, pct: opt.pct }, remarks: (f.remarks || '').trim(), at: t, checkFp: b.check.fp,
    acks: { reviewedCv: true, reviewedLab: true, nonDelegable: true, flags: b.check.overall === 'PASS_FLAGS' }
  };
  b.locked = true;
  X.audit(S, b, who, 'ENGINEER SIGN-OFF by ' + b.signoff.name + ' (licence ' + b.signoff.licence + ') — authorised: ' + b.signoff.deployment, t, 'ms');
  // carbon block at issue (inputs editable later on the Carbon screen; these are the issue-time values)
  const inputs = Object.assign({}, L.CARBON_DEFAULTS, { mass: L.recycledMass(b), dist: b.haulKm });
  b.passport = { id: 'DMP-2026-' + pad(S.seq.passport++, 4), issuedAt: t, carbon: { inputs, result: L.carbon(inputs) }, fp: '' };
  X.audit(S, b, who, 'Digital Material Passport ' + b.passport.id + ' issued', t, 'ms');
  b.passport.fp = L.fingerprint(JSON.stringify(X.buildRecord(b)));
  return b.signoff;
};
X.reopen = function (S, b, who, at) {
  if (b.locked) throw new Error('Approved batches cannot be re-opened.');
  X.audit(S, b, who, 'Batch re-opened for re-validation after rejection (previous rejection retained in audit trail)', at, 'ms');
  b.signoff = null;
};

/* Passport access — the ONLY way to obtain the record. */
X.passportAccess = function (b) {
  if (!b.signoff || b.signoff.status !== 'approved') return { ok: false, reason: 'No completed Engineer Review & Digital Sign-off is on record for this batch.' };
  if (!b.passport) return { ok: false, reason: 'Passport has not been issued.' };
  if (!b.signoff.licence || !b.signoff.name || !b.signoff.deployment) return { ok: false, reason: 'Sign-off block is incomplete.' };
  return { ok: true, reason: '' };
};
X.buildRecord = function (b) {
  const a = X.passportAccess(b);
  if (!a.ok) throw new Error('BLOCKED: ' + a.reason);
  const c = b.check, s = b.signoff;
  return {
    passportId: b.passport.id, batchId: b.id, issuedAt: b.passport.issuedAt, status: 'ENGINEER-AUTHORISED',
    origin: { sourceSite: b.site, location: b.city, structureType: b.structure, originalStructureAgeYears: b.ageYears, demolitionType: b.demolition === 'controlled' ? 'Controlled demolition' : 'General demolition', batchMassTonnes: b.tonnes, loggedAt: b.loggedAt, loggedBy: b.loggedBy },
    classification: { method: 'Simulated CV classification (advisory, probabilistic)', scanNo: b.cv.scanNo, sharesPct: Object.fromEntries(Object.entries(b.cv.shares).map(([k, v]) => [k, L.round(v * 100, 1)])), overallConfidencePct: L.round(b.cv.overallConf * 100, 1), contaminantGate: b.cv.gate, concreteShareOfMineralFractionPct: L.round(b.cv.concreteShare * 100, 1) },
    processingLog: { crusherFacilityId: b.processing.crusher, screeningSizeDistribution: b.processing.screen, washingStatus: b.processing.wash },
    labEvidence: { specificGravity: Number(b.lab.sg), waterAbsorptionPct: Number(b.lab.wa), aggregateImpactValuePct: Number(b.lab.aiv), losAngelesAbrasionPct: Number(b.lab.la), labReference: b.lab.ref || null, testDate: b.lab.date || null },
    isCodeCheck: { engine: 'Deterministic rule engine — IS 383:2016 Table 1 (not a model output)', declaredAggregate: c.declared, evaluatedAs: c.applied, intendedUse: L.USES[c.inputs.use], grade: c.inputs.grade, requestedReplacementPct: Number(c.inputs.pct), tableLimitPct: c.maxAllowed, verdict: L.OVERALL[c.overall].label, headline: c.headline, labScreen: c.lab.map(x => ({ parameter: x.label, value: x.value, state: x.state })), mixDesignNote: c.flags.includes('wa') ? 'Higher water absorption from adhered mortar — IS 456:2000 mix-design adjustment required.' : null, recordedAt: c.at, recordedBy: c.by },
    engineerSignOff: { name: s.name, licenceNumber: s.licence, authorisedSecondaryDeployment: s.deployment, conditions: s.remarks || null, digitalSignatureTimestamp: s.at, attestations: s.acks },
    embodiedCarbon: { formula: 'Carbon Avoided = (Mass of RCA Used × Embodied Carbon of Virgin Aggregate) − (Processing & Transport Emissions)', inputs: b.passport.carbon.inputs, result: { grossAvoidedKgCO2e: L.round(b.passport.carbon.result.gross, 1), processingKgCO2e: L.round(b.passport.carbon.result.proc, 1), transportKgCO2e: L.round(b.passport.carbon.result.trans, 1), netAvoidedKgCO2e: L.round(b.passport.carbon.result.net, 1), avoidancePct: L.round(b.passport.carbon.result.pct, 1) } },
    traceability: b.audit.filter(e => e.kind === 'ms').map(e => ({ at: e.at, actor: e.who, event: e.msg }))
  };
};
X.verifyPassport = function (b) {
  try { return L.fingerprint(JSON.stringify(X.buildRecord(b))) === b.passport.fp; } catch (e) { return false; }
};
/* Export — goes through the same gate; a blocked attempt is logged. */
X.exportPassport = function (S, b, who) {
  const a = X.passportAccess(b);
  if (!a.ok) { X.audit(S, b, who, 'BLOCKED: passport export attempted before engineer sign-off', X.nowIso(), 'evt'); return { ok: false, reason: a.reason }; }
  const rec = X.buildRecord(b);
  rec.integrity = { fingerprint: b.passport.fp, note: 'Demo integrity fingerprint — not cryptographic, not a blockchain record.' };
  return { ok: true, record: rec };
};

/* ---------- dashboard stats ---------- */
X.stats = function (S) {
  const B = S.batches, issued = B.filter(b => b.passport);
  const classified = B.filter(b => b.cv);
  const tot = B.reduce((s, b) => s + b.tonnes, 0);
  const cTon = classified.reduce((s, b) => s + b.tonnes, 0);
  const byClass = { concrete: 0, brick: 0, contam: 0, steel: 0 };
  classified.forEach(b => { Object.keys(byClass).forEach(k => byClass[k] += b.tonnes * b.cv.shares[k]); });
  const util = issued.map(b => {
    const sp = b.signoff.deploymentSpec, lim = L.TABLE1[sp.type] && L.TABLE1[sp.type][sp.use] ? L.TABLE1[sp.type][sp.use].max : null;
    return { b, pct: sp.pct, lim, ratio: lim ? sp.pct / lim : null, type: sp.type, use: sp.use };
  });
  const carbonNet = issued.reduce((s, b) => s + b.passport.carbon.result.net, 0);
  const hrs = issued.map(b => (new Date(b.signoff.at) - new Date(b.loggedAt)) / 36e5).filter(x => isFinite(x));
  const bySite = {};
  B.forEach(b => { bySite[b.site + '|' + b.city] = (bySite[b.site + '|' + b.city] || { site: b.site, city: b.city, t: 0 }); bySite[b.site + '|' + b.city].t += b.tonnes; });
  const sites = Object.values(bySite).sort((a, b) => b.t - a.t);
  const funnel = { logged: B.length, classified: classified.length, cleared: B.filter(b => b.cv && b.cv.gate === 'PASS').length, evidence: B.filter(b => b.cv && b.cv.gate === 'PASS' && L.evidenceComplete(b)).length, checked: B.filter(b => X.checkCurrent(b)).length, signed: B.filter(b => b.signoff && b.signoff.status === 'approved').length, issued: issued.length };
  const status = {}; B.forEach(b => { const k = X.statusOf(b).key; status[k] = (status[k] || 0) + 1; });
  return {
    totalBatches: B.length, tot, cTon, byClass, contamRate: cTon ? byClass.contam / cTon : 0,
    issued: issued.length, rejected: B.filter(b => b.signoff && b.signoff.status === 'rejected').length, util,
    avgUtil: util.filter(u => u.ratio !== null).length ? util.filter(u => u.ratio !== null).reduce((s, u) => s + u.ratio, 0) / util.filter(u => u.ratio !== null).length : null,
    carbonNet, avgHours: hrs.length ? hrs.reduce((a, b) => a + b, 0) / hrs.length : null, sites, over300: sites.filter(s => s.t >= 300).length, funnel, status,
    recycledT: issued.reduce((s, b) => s + b.passport.carbon.inputs.mass, 0)
  };
};

    (ro ? banner('info', 'info', 'View-only persona', 'Switch to <b>Field Technician</b> or <b>Structural Engineer</b> in the top bar to log a batch.') : '') +
    (!S.online ? '<div style="margin-bottom:1rem">' + banner('warn', 'cloudoff', 'Offline — field capture mode (simulated)', 'This batch will be saved on the device and marked <b>queued for sync</b> until you go online.') + '</div>' : '') +
    '<div class="grid g-side"><div class="card">' +
      fld('site', 'Source site / project', 'text', '', 'Name of the demolition site, e.g. “Bailey Road Bus Depot Slab”') +
      '<div class="two">' + fld('city', 'City, state', 'text', '', 'e.g. Patna, Bihar') +
      '<div class="field"><label for="lg-structure">Original structure type</label><select id="lg-structure" data-draft="log:structure"' + (ro ? ' disabled' : '') + '>' + X.STRUCTURES.map(s => '<option' + (v('structure', X.STRUCTURES[0]) === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></div></div>' +
      '<div class="two">' + fld('ageYears', 'Original structure age (years)', 'number', '', 'Age of the structure when demolished', ' min="0" max="150" step="1"') + fld('tonnes', 'Estimated debris mass (tonnes)', 'number', '', 'Weighbridge or survey estimate', ' min="1" max="100000" step="any"') + '</div>' +
      '<fieldset><legend>Type of demolition</legend><div class="choice" role="radiogroup" aria-label="Type of demolition">' +
        ['controlled', 'general'].map(k => '<label><input type="radio" name="lg-dem" value="' + k + '" data-draft="log:demolition"' + (v('demolition', 'controlled') === k ? ' checked' : '') + (ro ? ' disabled' : '') + '> ' + (k === 'controlled' ? 'Controlled demolition' : 'General demolition') + '</label>').join('') + '</div>' +
        '<span class="hint">Controlled = selective, pre-sorted deconstruction. General = mechanical bulk demolition.</span></fieldset>' +
      fld('haulKm', 'Distance from site to processing plant (km)', 'number', '20', 'Used later by the embodied-carbon engine', ' min="0" max="2000" step="any"') +
      '<div class="field"><label for="lg-notes">Notes (optional)</label><textarea id="lg-notes" rows="2" data-draft="log:notes"' + (ro ? ' disabled' : '') + '>' + esc(v('notes', '')) + '</textarea></div>' +
      '<div class="row"><button class="btn primary" data-act="submitLog"' + (ro ? ' disabled' : '') + '>' + (S.online ? 'Log batch' : 'Save offline & queue for sync') + '</button><button class="btn" data-act="demoFillLog"' + (ro ? ' disabled' : '') + '>Fill with demo values</button></div>' +
    '</div>' +
    '<div class="stack"><div class="card flat"><h3>What happens next</h3><ul class="tick">' +
      '<li>' + ico('scan', 17) + '<span>Simulated CV scan sorts the pile into four classes with confidence scores</span></li>' +
      '<li>' + ico('warn', 17) + '<span>Contaminants above the 5 % platform gate are flagged for removal — the batch does not move on until re-scanned</span></li>' +
      '<li>' + ico('rule', 17) + '<span>Lab values → deterministic IS 383:2016 check</span></li>' +
      '<li>' + ico('human', 17) + '<span>Engineer sign-off → Digital Material Passport</span></li></ul></div>' +
      '<div class="card flat"><h3>Offline-capable capture ' + bSim() + '</h3><p class="small">Toggle <b>Field mode</b> to Offline in the top bar, log a batch, then go back online and press <b>Sync</b>. The queue is real state in this prototype; the network itself is simulated.</p></div></div></div>';
}
function submitLog() {
  if (!can('log')) { toast('Your persona cannot log batches.', 'fail'); return; }
  const g = (k, d) => dv('log:' + k, d), e = {};
  const site = String(g('site', '')).trim(), city = String(g('city', '')).trim();
  const age = Number(g('ageYears', '')), t = Number(g('tonnes', '')), haul = Number(g('haulKm', '20'));
  if (site.length < 3) e.site = 'Enter the site or project name (at least 3 characters).';
  if (city.length < 2) e.city = 'Enter the city and state.';
  if (g('ageYears', '') === '' || !isFinite(age) || age < 0 || age > 150) e.ageYears = 'Enter an age between 0 and 150 years.';
  if (g('tonnes', '') === '' || !isFinite(t) || t < 1 || t > 100000) e.tonnes = 'Enter a mass between 1 and 100,000 tonnes.';
  if (!isFinite(haul) || haul < 0 || haul > 2000) e.haulKm = 'Enter a distance between 0 and 2,000 km.';
  UI.err['log'] = e;
  if (Object.keys(e).length) { render(); const f = document.querySelector('[aria-invalid="true"]'); if (f) f.focus(); toast('Please fix the highlighted fields.', 'fail'); return; }
  const b = X.newBatch(S, { site, city, structure: g('structure', X.STRUCTURES[0]), ageYears: age, demolition: g('demolition', 'controlled'), tonnes: t, haulKm: haul, notes: g('notes', ''), sync: S.online ? 'synced' : 'queued' }, who());
  S.batches.sort((x, y) => x.id < y.id ? -1 : 1);
  clearDrafts('log:'); UI.err['log'] = null; save();
  UI.bid = b.id; UI.step = 'classify'; UI.route = 'work'; UI.focusMain = true;
  toast('Batch ' + b.id + ' logged' + (b.sync === 'queued' ? ' offline — queued for sync.' : '.') + ' Next: run the simulated CV scan.', 'pass');
  render();
}
function demoFillLog() {
  const n = S.batches.length + 1;
  const sites = ['Gomti Nagar Cinema Hall Block', 'Old Mill Chimney Base — Coimbatore', 'Sector 9 Community Centre Slab', 'Ring Road Overpass Pier P-4'];
  const s = sites[n % sites.length], cities = ['Lucknow, Uttar Pradesh', 'Coimbatore, Tamil Nadu', 'Chandigarh', 'Indore, Madhya Pradesh'];
  Object.assign(UI.draft, { 'log:site': s, 'log:city': cities[n % cities.length], 'log:structure': X.STRUCTURES[n % X.STRUCTURES.length], 'log:ageYears': String(20 + (n * 7) % 45), 'log:tonnes': String(250 + (n * 130) % 700), 'log:demolition': 'controlled', 'log:haulKm': '18', 'log:notes': 'Demo values — synthetic.' });
  UI.err['log'] = null; render();
}

/* =====================================================================
   UI part B: Batch Workspace — Classify · Evidence · IS check · Sign-off · Passport

const STEPS = [['classify', '1', 'Classify', 'CV · advisory'], ['evidence', '2', 'Evidence', 'Processing + lab'], ['check', '3', 'IS-code check', 'Deterministic'], ['signoff', '4', 'Engineer sign-off', 'Human authority'], ['passport', '5', 'Passport', 'Reuse']];
const touch = b => { if (!S.online) b.sync = 'queued'; };
const GEN = {};
function getGen(b, scan) { const k = b.id + ':' + scan.n + ':' + scan.seed; if (!GEN[k]) GEN[k] = L.generateScan(scan.scene, scan.seed); return GEN[k]; }
const switchBtn = (p, label) => '<button class="btn small" data-act="asPersona" data-p="' + p + '">' + label + '</button>';

function viewWork() {
  const b = curBatch();
  if (!b) return '<div class="view-head"><div><h1 id="h1">Batch Workspace</h1></div></div>' + banner('info', 'info', 'No batches yet', 'Log a batch first. <a href="#" data-act="go" data-route="log">Log a batch →</a>');
  const st = X.stages(b), status = X.statusOf(b);
  const ro = !can('scan');
  const stepper = '<ol class="stepper" aria-label="Pipeline steps for ' + esc(b.id) + '">' + STEPS.map(s => {
    const x = st[s.k || s[0]], key = s[0];
    const cls = (x.done ? 'done ' : '') + (x.locked ? 'locked' : '');
    const icon = x.done ? ico('check', 13) : x.locked ? ico('lock', 13) : x.warn ? ico('warn', 13) : ico('info', 13);
    return '<li><button class="' + cls + '" data-act="step" data-step="' + key + '"' + (UI.step === key ? ' aria-current="step"' : '') + '><span class="sn">Step ' + s[1] + ' · ' + s[3] + '</span><span class="st">' + s[2] + '</span><span class="ss">' + icon + ' ' + esc(x.note) + '</span></button></li>';
  }).join('') + '</ol>';
  const head = '<div class="view-head"><div><div class="eyebrow">Batch workspace</div><h1 id="h1">' + esc(b.site) + '</h1><p><span class="mono">' + esc(b.id) + '</span> · ' + esc(b.city) + ' · ' + N(b.tonnes) + ' t · ' + (b.demolition === 'controlled' ? 'controlled' : 'general') + ' demolition · ' + b.ageYears + '-year-old ' + esc(b.structure.toLowerCase()) + ' · ' + (b.sync === 'queued' ? 'queued for sync' : 'synced') + '</p></div>' +
    '<div class="row"><div class="field" style="margin:0"><label for="pick">Batch</label><select id="pick" data-chg="pickBatch">' + S.batches.map(x => '<option value="' + x.id + '"' + (x.id === b.id ? ' selected' : '') + '>' + x.id + ' — ' + esc(x.site) + '</option>').join('') + '</select></div>' + stPill(status) + '</div></div>';
  const roBanner = ro ? '<div style="margin-bottom:1rem">' + banner('info', 'info', 'Read-only view (' + esc(persona().label) + ')', 'This persona cannot change pipeline data. ' + switchBtn('tech', 'Switch to Field Technician') + ' ' + switchBtn('eng', 'Switch to Structural Engineer')) + '</div>' : '';
  const lockBanner = b.locked ? '<div style="margin-bottom:1rem">' + banner('pass', 'lock', 'Batch locked after engineer sign-off', 'Evidence, checks and classification can no longer be edited — the passport fingerprint covers them.') + '</div>' : '';
  let body = '';
  if (UI.step === 'classify') body = stepClassify(b);
  else if (UI.step === 'evidence') body = stepEvidence(b);
  else if (UI.step === 'check') body = stepCheck(b);
  else if (UI.step === 'signoff') body = stepSignoff(b);
  else body = stepPassport(b);
  return head + roBanner + lockBanner + stepper + '<div id="step-body">' + body + '</div>';
}

/* ---------- STEP 1: CLASSIFY ---------- */
const CSTY = {
  concrete: { stroke: '#FFFFFF', dash: '', w: 1.6, chip: '#FFFFFF', ink: '#0E2841', tag: 'C1' },
  brick: { stroke: '#FFB27A', dash: '5 3', w: 1.8, chip: '#FFB27A', ink: '#3B1500', tag: 'C2' },
  contam: { stroke: '#FF5AE0', dash: '', w: 3, chip: '#FF5AE0', ink: '#2B002A', tag: 'C3✕' },
  steel: { stroke: '#6FD3FF', dash: '1.5 3', w: 2.2, chip: '#6FD3FF', ink: '#00283B', tag: 'C4' }
};
function pileSvg(gen, animate) {
  const f = gen.frags;
  let s = '<svg viewBox="0 0 640 400" role="img" aria-label="Simulated overhead camera view of a debris pile with classification boxes. Every fragment is also listed in the fragment table below.">' +
    '<rect width="640" height="400" fill="#3A4048"/>' + '<path d="M0 100H640M0 200H640M0 300H640M160 0V400M320 0V400M480 0V400" stroke="#4A525B" stroke-width="1"/>';
  f.forEach(fr => { s += '<polygon points="' + fr.pts.map(p => p.join(',')).join(' ') + '" fill="' + fr.fill + '" stroke="#15181c" stroke-opacity=".55" stroke-width="1"/>'; });
  f.forEach((fr, i) => {
    const c = CSTY[fr.pred], b = fr.bbox, low = fr.conf < L.LOWCONF, tag = c.tag + (low ? '?' : ''), w = 10 + tag.length * 6.2, y = Math.max(0, b[1] - 11);
    s += '<g' + (animate ? ' class="det" style="animation-delay:' + (150 + i * 26) + 'ms"' : '') + '><title>Fragment ' + fr.id + ': ' + esc(L.CLASSES.find(x => x.id === fr.pred).short) + (fr.sub ? ' (' + fr.sub + ')' : '') + ', confidence ' + Math.round(fr.conf * 100) + ' %' + (low ? ' — low confidence, manual review' : '') + '</title>' +
      '<rect x="' + (b[0] - 1.5) + '" y="' + (b[1] - 1.5) + '" width="' + (b[2] - b[0] + 3) + '" height="' + (b[3] - b[1] + 3) + '" fill="none" stroke="' + c.stroke + '" stroke-width="' + c.w + '"' + (c.dash ? ' stroke-dasharray="' + c.dash + '"' : '') + (low ? ' stroke-opacity=".6"' : '') + '/>' +
      '<rect x="' + b[0] + '" y="' + y + '" width="' + w + '" height="10.5" rx="2" fill="' + c.chip + '"/><text x="' + (b[0] + 4) + '" y="' + (y + 8) + '" font-size="8.5" font-weight="700" font-family="Poppins,Segoe UI,sans-serif" fill="' + c.ink + '">' + tag + '</text></g>';
  });
  if (animate) s += '<rect class="scanline" x="-6" y="0" width="6" height="400" fill="#7CFFB2" opacity=".85"/>';
  return s + '</svg>';
}
const legendHtml = () => '<div class="legend" aria-label="Legend">' + L.CLASSES.map(c => {
  const st = CSTY[c.id];
  return '<span><svg width="30" height="16" aria-hidden="true"><rect x="1.5" y="1.5" width="27" height="13" fill="#3A4048" stroke="' + st.stroke + '" stroke-width="' + st.w + '"' + (st.dash ? ' stroke-dasharray="' + st.dash + '"' : '') + '/></svg><b>' + st.tag + '</b> ' + c.short + '</span>';
}).join('') + '<span class="muted">? = confidence below ' + Math.round(L.LOWCONF * 100) + ' %</span></div>';

function sliderHtml(k, label, val, dis) {
  return '<div class="field" style="margin-bottom:.5rem"><label for="sc-' + k + '">' + label + ' <span class="num" id="sc-' + k + '-v">' + Math.round(val) + '</span></label><input type="range" id="sc-' + k + '" min="0" max="100" step="1" value="' + Math.round(val) + '" data-live="scene" data-k="' + k + '"' + (dis ? ' disabled' : '') + '></div>';
}
function sceneNormText(sc) {
  const n = L.normalizeScene(sc);
  return 'Scene composition (normalised): concrete ' + P(n.concrete, 0) + ' · brick ' + P(n.brick, 0) + ' · contaminants ' + P(n.contam, 0) + ' · steel ' + P(n.steel, 0);
}
function classResults(b) {
  const cv = b.cv;
  if (!cv) return '<div class="card">' + banner('info', 'info', 'No scan yet', 'Choose a capture scenario and press <b>Run simulated CV classification</b>. The pile is generated from the scenario and classified fragment by fragment.') + '</div>';
  const contam = b.tonnes * cv.shares.contam, onward = b.tonnes * (cv.shares.concrete + cv.shares.brick), steel = b.tonnes * cv.shares.steel;
  const rows = L.CLASSES.map((c, i) => '<tr><td><b>Class ' + c.n + '</b><br>' + c.name + '</td><td class="r num">' + P(cv.shares[c.id]) + '</td><td class="r num">' + N(b.tonnes * cv.shares[c.id], 1) + ' t</td><td class="r num">' + (cv.meanConf[c.id] === null ? '—' : P(cv.meanConf[c.id], 0)) + '</td><td class="small">' + (c.id === 'contam' && cv.gate === 'FLAGGED' ? '<b>' + ico('warn', 13) + ' FLAGGED FOR REMOVAL</b>' : c.route) + '</td></tr>').join('');
  const stack = '<div class="stackbar" role="img" aria-label="' + L.CLASSES.map(c => c.short + ' ' + P(cv.shares[c.id])).join(', ') + '">' + L.CLASSES.map((c, i) => '<i class="hatch' + (i + 1) + '" style="width:' + (cv.shares[c.id] * 100) + '%"></i>').join('') + '</div>';
  const gate = cv.gate === 'FLAGGED'
    ? banner('fail', 'warn', 'FLAGGED FOR REMOVAL — contaminants ' + P(cv.shares.contam) + ' exceed the ' + P(L.CONTAM_GATE, 0) + ' platform gate', N(contam, 1) + ' t of wood, plastic, gypsum and soil are <b>not passed through</b>: Evidence and every later step stay locked until the pile is cleaned and re-scanned. ' + src('Platform rule — not an IS-code figure'), 'big')
    : banner('pass', 'check', 'Contamination gate passed — contaminants ' + P(cv.shares.contam) + ' (gate: ≤ ' + P(L.CONTAM_GATE, 0) + ')', (contam > 0 ? N(contam, 1) + ' t of contaminants are still routed for removal. ' : '') + 'The batch may proceed to the Evidence step. ' + src('Platform rule — not an IS-code figure'));
  const sub = cv.contamSub, subTxt = cv.shares.contam > 0 ? Object.keys(sub).map(k => k + ' ' + P(sub[k], 0)).join(' · ') : 'none detected';
  const elig = cv.concreteShare >= L.RCA_MIN_CONCRETE_SHARE
    ? banner('info', 'info', 'Stream advisory: concrete-dominant (' + P(cv.concreteShare) + ' of mineral fraction)', 'May be declared <b>RCA</b> in the IS-code check. Platform rule: RCA needs ≥ ' + P(L.RCA_MIN_CONCRETE_SHARE, 0) + ' concrete-derived mineral fraction.')
    : banner('warn', 'warn', 'Stream advisory: only ' + P(cv.concreteShare) + ' concrete-derived — evaluate as RA', 'Below the ' + P(L.RCA_MIN_CONCRETE_SHARE, 0) + ' RCA purity rule, so the IS-code check will treat this stream as <b>RA</b>, which Table 1 permits in <b>lean concrete only</b>. The AI can only tighten a limit, never relax it.');
  const hist = '<div class="tablewrap"><table><thead><tr><th>Scan</th><th>Time</th><th>By</th><th class="r">Contaminants</th><th class="r">Mean conf.</th><th>Gate</th></tr></thead><tbody>' + b.scans.slice().reverse().map(s => '<tr><td>#' + s.n + (s.note ? '<br><span class="tiny muted">' + esc(s.note) + '</span>' : '') + '</td><td class="small">' + fmtDT(s.at) + '</td><td class="small">' + esc(s.by) + '</td><td class="r num">' + P(s.summary.shares.contam) + '</td><td class="r num">' + P(s.summary.overallConf, 0) + '</td><td>' + (s.summary.gate === 'FLAGGED' ? tone('fail', 'FLAGGED', 'warn') : tone('pass', 'PASSED', 'check')) + '</td></tr>').join('') + '</tbody></table></div>';
  const gen = getGen(b, b.scans[b.scans.length - 1]);
  const frt = '<details class="acc"><summary>Fragment table (all ' + gen.frags.length + ' detections — accessible alternative to the image)</summary><div class="tablewrap" style="max-height:320px;overflow:auto;margin-top:.5rem"><table><thead><tr><th>#</th><th>Predicted class</th><th class="r">Confidence</th><th>Note</th></tr></thead><tbody>' + gen.frags.map(fr => '<tr><td>' + fr.id + '</td><td>' + CSTY[fr.pred].tag + ' ' + L.CLASSES.find(c => c.id === fr.pred).short + (fr.sub ? ' — ' + fr.sub : '') + '</td><td class="r num">' + P(fr.conf, 0) + '</td><td class="small">' + (fr.conf < L.LOWCONF ? ico('warn', 12) + ' manual review' : '') + (fr.pred === 'contam' ? ' remove' : '') + '</td></tr>').join('') + '</tbody></table></div></details>';
  const meth = '<details class="acc"><summary>Methodology — simulated CV classification (read this)</summary><div class="small" style="margin-top:.5rem"><p>This is <b>not a trained vision model</b>. Each simulated fragment gets image-like features (hue, saturation, brightness, texture, edge straightness, metallic index, elongation) drawn from class-specific distributions, with noise that grows as lighting, focus and dust get worse. A weighted Gaussian-likelihood classifier then scores every fragment against the four classes (contaminants are a mixture of wood, plastic, gypsum and soil) and converts scores to a probability with a softmax whose temperature rises with poor capture quality. Confidence is <b>uncalibrated</b>.</p><p>Different scenarios and capture conditions therefore give genuinely different outputs. Production would replace this with a fine-tuned YOLOv8 / MobileNet-SSD model on labelled C&amp;D imagery (a named gap). Feature weights: ' + Object.keys(L.MODEL_INFO.weights).map(k => k + ' ×' + L.MODEL_INFO.weights[k]).join(', ') + '. Softmax temperature ' + L.MODEL_INFO.temperature + ' at perfect capture.</p>' +
    '<p><label class="check"><input type="checkbox" data-live="truth"' + (UI.showTruth ? ' checked' : '') + '> Reveal simulator ground truth (developer view)</label>' + (UI.showTruth ? '<b>' + cv.truthMatch + ' of ' + cv.n + '</b> fragments were classified the same as the scenario ground truth in scan #' + cv.scanNo + '. Capture quality index: ' + P(cv.quality, 0) + '.' : '') + '</p></div></details>';
  return '<div class="stack"><div class="card"><div class="row between"><h3 style="margin:0">Scan #' + cv.scanNo + ' result</h3>' + bAI() + '</div>' + '<div style="margin-top:.6rem">' + gate + '</div>' +
    '<div class="tablewrap" style="margin-top:.8rem"><table><thead><tr><th>Class</th><th class="r">Share (area)</th><th class="r">Mass</th><th class="r">Mean conf.</th><th>Routing</th></tr></thead><tbody>' + rows + '</tbody></table></div><div style="margin-top:.6rem">' + stack + '</div>' +
    '<p class="small" style="margin-top:.6rem"><b>Mass routing:</b> ' + N(onward, 1) + ' t mineral fraction onward · ' + N(contam, 1) + ' t contaminants to removal · ' + N(steel, 1) + ' t reinforcing steel to salvage. Mass split uses area share as a proxy.</p>' +
    '<p class="small"><b>Contaminants detected:</b> ' + subTxt + '.</p>' +
    (cv.lowConfCount ? '<p class="small">' + ico('warn', 14) + ' ' + cv.lowConfCount + ' fragment(s) (' + P(cv.lowConfShare) + ' by area) scored below ' + Math.round(L.LOWCONF * 100) + ' % confidence — manual verification recommended.</p>' : '') + '<div>' + elig + '</div>' +
    (cv.gate === 'FLAGGED' && can('scan') && !b.locked ? '<div class="row" style="margin-top:.8rem"><button class="btn accent" data-act="removal"' + (UI.scanning ? ' disabled' : '') + '>' + ico('refresh', 16) + ' Log contaminant removal &amp; re-scan</button><span class="small muted">Simulates removing ~95 % of the contaminants by hand, then re-scanning.</span></div>' : '') +
    '</div>' + '<div class="card flat"><h3>Scan history</h3>' + hist + '</div>' + frt + meth + '</div>';
}
function stepClassify(b) {
  const scan = b.scans[b.scans.length - 1] || null;
  const scanning = UI.scanning && UI.scanning.bid === b.id ? UI.scanning : null;
  const editable = can('scan') && !b.locked && !scanning;
  const gen = scanning ? scanning.gen : (scan ? getGen(b, scan) : null);
  const sc = b.scene;
  const pile = gen
    ? '<div class="pilebox">' + pileSvg(gen, !!scanning && !REDUCED) + '<div class="cap"><span>' + (scanning ? 'Scanning… detecting ' + gen.frags.length + ' fragments' : 'Scan #' + scan.n + ' · ' + gen.frags.length + ' fragments · ' + fmtDT(scan.at)) + '</span><span>Simulated tablet camera · not a real image</span></div></div>' + legendHtml()
    : '<div class="pilebox"><div style="height:300px;display:grid;place-items:center;color:#D6DEE7;text-align:center;padding:1rem">' + ico('scan', 40) + '<div>No scan yet.<br>Set the capture scenario below and run the simulated classification.</div></div></div>';
  const presets = Object.keys(L.SCENE_PRESETS).map(k => '<button class="btn small" data-act="preset" data-k="' + k + '"' + (editable ? '' : ' disabled') + '>' + L.SCENE_PRESETS[k].label + '</button>').join('');
  const ctl = '<div class="card"><div class="row between"><h3 style="margin:0">Capture scenario</h3>' + bSim('SIMULATED INPUT') + '</div>' +
